[project]
name = "darwin-agent"
version = "0.2.1"
requires-python = ">=3.11"
dependencies = [
    # Modal serverless
    "modal>=0.64",
    # HTTP to God Layer
    "httpx>=0.27",
    # Config templating
    "jinja2>=3.1",
    "pydantic-settings>=2.5",
    "psutil>=5.9",
    # Live per-model pricing — replaces hardcoded _MODEL_COSTS table
    "litellm>=1.40",
]

# Hermes is installed separately as a submodule editable install:
#   uv pip install -e hermes-core[all]
# It is NOT listed here as a regular dependency because it is a local
# submodule, not a PyPI package — adding it here breaks uv build resolution.

[project.entry-points."hermes_agent.plugins"]
darwin = "darwin_tools:register"

[tool.setuptools.packages.find]
include = ["darwin_tools*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "fakeredis>=2.23.0",
    "pytest-cov>=5.0.0",
]

[tool.uv]
# Note: we intentionally do NOT set `package = false` here because
# darwin_tools must be installed as a package for entry-point discovery
# (hermes_agent.plugins) to work.  Local dev: `uv pip install -e .`

[tool.setuptools.package-data]
darwin_tools = ["py.typed", "plugin.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["darwin_tools"]
omit = ["tests/*", "hermes-core/*", ".venv/*"]
