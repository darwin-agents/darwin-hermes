[project]
name = "darwin-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Core
    "modal>=0.64.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # LLM providers
    "anthropic>=0.28.0",
    "openai>=1.35.0",
    # Tracing
    "langsmith>=0.1.77",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    # Redis
    "redis>=5.0.0",
    # Utilities
    "jinja2>=3.1.4",
    "psutil>=5.9.8",
    "python-jose>=3.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "fakeredis>=2.23.0",
    "pytest-cov>=5.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "hermes-core/*", ".venv/*"]
